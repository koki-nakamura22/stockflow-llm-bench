version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      CURSOR_SECRET: benchmark-public-secret
      DATABASE_URL: postgresql+psycopg://stockflow:stockflow@db:5432/stockflow
    networks:
      - default
    ports:
      - "8000:8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_USER: stockflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - default
    volumes:
      - stockflow-db:/var/lib/postgresql/data
networks:
  default:
    name: workspace_default
volumes:
  stockflow-db:
    name: workspace_stockflow-db
