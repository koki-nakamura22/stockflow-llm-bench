[project]
name = "stockflow-reference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
  "httpx==0.28.1"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stockflow*"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.12", "mypy==1.15.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
